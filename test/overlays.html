<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Overlays harness</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
  :root{--ink:#fff;--soft:#c3c6cd;--mute:#9a9ea7;--rule:#2a2c32;
    --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
    --sans:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
  html{background:#000;color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;font-optical-sizing:auto}
  body{margin:0;padding:40px 24px;min-height:200vh}
  h1{font-weight:300;font-size:28px;margin:0 0 16px;font-variation-settings:"opsz" 32}
  p{max-width:44ch;color:var(--soft);font-size:13px;line-height:1.5}
  button{font-family:var(--mono);font-size:11px;color:var(--ink);background:#000;border:1px solid var(--rule);padding:8px 12px;margin:0 8px 8px 0;cursor:pointer}
  button:hover{border-color:var(--mute)}
  #log{font-family:var(--mono);font-size:11px;color:var(--mute);white-space:pre-wrap;margin-top:24px}
</style>
</head>
<body>
<h1>Overlays harness</h1>
<p>Loads the two data files, builds the dictionary and the references pages, and opens the dictionary. The dictionary is one dense text: click a term to open its definition under it, click again to close it. Esc or the close text at the top right closes the page.</p>
<button id="bd">Open dictionary</button>
<button id="br">Open references</button>
<button id="bc">Close</button>
<div id="log"></div>

<script src="../js/overlays.js"></script>
<link rel="stylesheet" href="../css/overlays.css">
<script>
(function () {
  var log = document.getElementById('log');
  function say(s) { log.textContent += s + '\n'; }

  var ERAS = {1: 'Preliterate', 2: 'Ancient', 3: 'Pilgrimage', 4: 'Sail', 5: 'Industry and flight',
    6: 'Heroic space age', 7: 'Reckoning', 8: 'Now', 9: 'Future'};
  var TIERS = {M: 'Meaning', V: 'Value', P: 'Practice', F: 'Form', E: 'Event'};
  var PN = {L: 'the one leaving', W: 'the one watching', M: 'the one preparing', A: 'shared'};

  Promise.all([
    fetch('../data/map.json').then(function (r) { return r.json(); }),
    fetch('../data/refs.json').then(function (r) { return r.json(); })
  ]).then(function (res) {
    var map = res[0], refs = res[1];
    ODOverlays.build({
      terms: map.terms,
      events: map.events,
      refs: refs,
      eraName: function (e) { return ERAS[e] || ''; },
      tierName: function (t) { return TIERS[t] || ''; },
      personName: function (p) { return PN[p] || ''; },
      // still accepted by build(); the dictionary opens definitions inline and does not call it
      openTerm: function (id, kind) { say('openTerm(' + id + ', ' + kind + ')'); }
    });
    say('built: ' + map.terms.length + ' terms, ' + map.events.length + ' events, ' + refs.length + ' references');
    ODOverlays.openDictionary();
    say('isOpen: ' + ODOverlays.isOpen());
    var n = document.querySelectorAll('.odo-dict .odo-t').length;
    var l = document.querySelectorAll('.odo-dict .odo-l').length;
    say('dictionary: ' + n + ' terms in flow, ' + l + ' letter markers');
  }).catch(function (err) { say('error: ' + err); });

  document.getElementById('bd').addEventListener('click', function () { ODOverlays.openDictionary(); });
  document.getElementById('br').addEventListener('click', function () { ODOverlays.openReferences(); });
  document.getElementById('bc').addEventListener('click', function () { ODOverlays.close(); });
})();
</script>
</body>
</html>
